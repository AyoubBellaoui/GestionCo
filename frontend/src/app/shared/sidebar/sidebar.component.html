<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-box">G</div>
    <div class="logo-text">Gestion<span>Co.</span></div>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.to) {
      <a [routerLink]="item.to" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.end}" class="nav-item">
        <span class="nav-icon">{{ item.icon }}</span> {{ item.label }}
      </a>
    }

    <div class="sidebar-divider"></div>

    <a routerLink="/journal-audit" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🔎</span> Journal d'audit
    </a>
    <a routerLink="/parametres" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">⚙️</span> Paramètres
    </a>
  </nav>

  <div class="sidebar-user">
    <div class="user-avatar">{{ initials }}</div>
    <div class="user-info">
      <div class="user-name">{{ auth.user?.nom || 'Utilisateur' }}</div>
      <div class="user-role">{{ auth.user?.role || 'Admin' }}</div>
    </div>
    <button class="user-logout" title="Déconnexion" (click)="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</aside>
