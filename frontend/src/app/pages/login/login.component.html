<div class="login-wrapper">
  <div class="bg-decoration">
    <div class="bg-grid"></div>
    <div class="bg-blur-1"></div>
    <div class="bg-blur-2"></div>
    <div class="bg-blur-3"></div>
  </div>

  <div class="login-page">
    <div class="brand">
      <div class="logo-box">G</div>
      <div class="logo-text">Gestion<span>Co.</span></div>
    </div>

    <div class="login-card">
      <div class="form-header">
        <h1 class="form-title">Bienvenue 👋</h1>
        <p class="form-subtitle">Connectez-vous pour accéder à votre espace de gestion.</p>
      </div>

      @if (error) {
        <div class="error-message visible">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ error }}</span>
        </div>
      }

      <form (ngSubmit)="handleSubmit()">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <input type="email" class="form-input" placeholder="nom@entreprise.ma" [(ngModel)]="email" name="email" required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input [type]="showPassword ? 'text' : 'password'" class="form-input" placeholder="••••••••" [(ngModel)]="password" name="password" required />
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
              @if (showPassword) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember" [(ngModel)]="remember" name="remember" />
            <label for="remember">Rester connecté</label>
          </div>
          <a href="#" class="forgot-link" (click)="$event.preventDefault(); forgotPassword()">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          {{ loading ? 'Connexion…' : 'Se connecter' }}
          @if (!loading) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          }
        </button>
      </form>

      <div class="form-footer" style="margin-top:24px">
        Pas de compte ? Contactez votre <a href="#" (click)="$event.preventDefault()">administrateur</a>.
      </div>
    </div>

    <div class="page-footer">
      <span class="footer-text">© 2026 GestionCo.</span>
      <span class="footer-dot"></span>
      <div class="lang-switcher">
        <button [class]="'lang-btn' + (lang==='FR' ? ' active' : '')" (click)="lang='FR'">FR</button>
        <button [class]="'lang-btn' + (lang==='EN' ? ' active' : '')" (click)="lang='EN'">EN</button>
        <button [class]="'lang-btn' + (lang==='AR' ? ' active' : '')" (click)="lang='AR'">AR</button>
      </div>
      <span class="footer-dot"></span>
      <span class="footer-text">PFE 2026</span>
    </div>

    <div class="tech-badge">
      <span class="tech-tag">Angular 18</span>
      <span class="tech-tag">.NET 9</span>
      <span class="tech-tag">SQL Server</span>
    </div>
  </div>
</div>
<app-toast></app-toast>
