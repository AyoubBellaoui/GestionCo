<app-topbar [title]="tabTitle" [subtitle]="tabSubtitle" [icon]="tabIcon">
  @if (activeTab === 'achats') {
    <button class="btn btn-ghost" (click)="exportExcel()" [disabled]="exportingExcel" title="Exporter en Excel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      {{ exportingExcel ? 'Export…' : 'Exporter Excel' }}
    </button>
  }
  @if (activeTab === 'achats') {
    <button class="btn btn-primary" (click)="router.navigate(['/achats/nouveau'])">+ Nouvel achat</button>
  }
  @if (activeTab === 'charges') {
    <button class="btn btn-ghost btn-sm" (click)="openCatModal()" title="Gérer les catégories">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Catégories
    </button>
  }
  @if (activeTab === 'charges') {
    <button class="btn btn-ghost btn-sm" (click)="genererRecurrentes()" [disabled]="chargesGenerating" title="Générer les charges récurrentes du mois en cours">
      🔁 {{ chargesGenerating ? 'Génération…' : 'Générer récurrentes' }}
    </button>
  }
  @if (activeTab === 'charges') {
    <button class="btn btn-primary" (click)="router.navigate(['/charges/nouvelle'])">+ Nouvelle charge</button>
  }
</app-topbar>

<div class="depenses-tabs-bar">
  <button
    class="depenses-tab"
    [class.active]="activeTab === 'achats'"
    (click)="setTab('achats')">
    <span class="depenses-tab-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </span>
    <span class="depenses-tab-label">Achats</span>
    @if (achatsCount > 0) {
      <span class="depenses-tab-count">{{ achatsCount }}</span>
    }
  </button>

  <button
    class="depenses-tab"
    [class.active]="activeTab === 'charges'"
    (click)="setTab('charges')">
    <span class="depenses-tab-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </span>
    <span class="depenses-tab-label">Charges</span>
    @if (chargesCount > 0) {
      <span class="depenses-tab-count">{{ chargesCount }}</span>
    }
  </button>
</div>

@if (activeTab === 'achats') {
  <app-achats [hideTopbar]="true" />
}
@if (activeTab === 'charges') {
  <app-charges [hideTopbar]="true" />
}
